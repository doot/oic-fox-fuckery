inputs:
  devenv-base:
    url: github:doot/devenv-base
    flake: true
  nixpkgs:
    follows: devenv-base/nixpkgs
  git-hooks:
    follows: devenv-base/git-hooks
  crate2nix:
    url: github:nix-community/crate2nix
    inputs:
      nixpkgs:
        follows: nixpkgs
  mk-shell-bin:
    url: github:rrbutani/nix-mk-shell-bin
  nix2container:
    url: github:nlewo/nix2container
    inputs:
      nixpkgs:
        follows: nixpkgs
  rust-overlay:
    url: github:oxalica/rust-overlay
    inputs:
      nixpkgs:
        follows: nixpkgs
imports:
- devenv-base
profile: rust
